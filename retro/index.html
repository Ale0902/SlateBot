<!DOCTYPE html>
<html lang="en" data-theme-id="retro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate Bot - Instant Message</title>
<link rel="stylesheet" href="retro.css">
</head>
<body>
<!-- A 2000s instant-messenger skin for the same app as ../index.html: same
     dist/main.js, same element ids, same saved chats. -->
<div class="app window">
  <header class="titlebar">
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 12 10" width="14" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h12v10H0zM1 1v8h3V1zm4 0v8h6V1z" fill="currentColor" fill-rule="evenodd"/></svg>
    </button>
    <span class="title-text"><span id="chatTitle">New chat</span> - Instant Message</span>
    <div class="window-controls" aria-label="Window controls">
      <button type="button" class="window-control" id="minimizeBtn" aria-label="Minimize window" title="Minimize">_</button>
      <button type="button" class="window-control" id="maximizeBtn" aria-label="Maximize window" title="Maximize">□</button>
      <button type="button" class="window-control close" id="closeBtn" aria-label="Close window" title="Close">×</button>
    </div>
  </header>

  <div class="panes">
    <aside class="sidebar" id="sidebar">
      <div class="buddy-list">
        <div class="buddy">
          <svg viewBox="0 0 18 13" width="22" height="16" shape-rendering="crispEdges" aria-hidden="true"><rect x=".5" y=".5" width="17" height="12" fill="#f7a823" stroke="#3d3a2e"/><path d="M1 1l8 6 8-6" fill="none" stroke="#3d3a2e"/></svg>
          <div>
            <div class="buddy-name">Slate Bot</div>
            <div class="buddy-status">online</div>
          </div>
        </div>
        <div class="section-label">Recent IMs</div>
        <div class="recent-list" id="recents"></div>
      </div>
      <div class="model-row">
        <span class="model-info" id="modelInfo"></span>
        <button type="button" class="about-btn" id="aboutBtn">About</button>
      </div>
      <button type="button" class="nav-item" id="newChatBtn">
        <svg viewBox="0 0 14 14" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><rect x=".5" y=".5" width="13" height="13" fill="#ffe45c" stroke="#3d3a2e"/><path d="M3 4h8v1H3zm0 3h8v1H3zm0 3h5v1H3z" fill="#3d3a2e"/></svg>
        New IM
      </button>
    </aside>

    <div class="workspace" id="workspace">
      <div class="convo">
        <div class="avatar-col">
          <!-- Filled in by retro.js with whichever icon was picked for it. -->
          <button type="button" class="buddy-icon icon-btn" id="botIconBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="botIconPicker" aria-label="Change Slate Bot's icon" title="Change Slate Bot's icon"></button>
          <span class="sn-label">Slate Bot</span>
          <span class="bot-status" id="botStatus" role="status" aria-live="polite">Online</span>
          <div class="popover icon-picker bot-icon-picker" id="botIconPicker" role="dialog" aria-label="Choose Slate Bot's icon" hidden>
            <div class="popover-title">Choose Slate Bot's Icon</div>
            <div class="icon-grid" id="botIconGrid"></div>
          </div>
        </div>
        <main id="chat" class="chat" aria-live="polite"></main>
      </div>

      <div class="toolbar">
        <div class="suggestions" id="suggestions">
          <button class="chip" type="button">Explain something simply</button>
          <button class="chip" type="button">Help me write an email</button>
          <button class="chip" type="button">Brainstorm ideas with me</button>
        </div>
        <div class="format-bar">
          <div class="format-group">
            <button type="button" class="fmt-btn" id="textColorBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="textColorPicker" aria-label="Text color" title="Text color">
              <span>A</span><span class="fmt-bar"></span>
            </button>
            <div class="popover color-picker" id="textColorPicker" role="dialog" aria-label="Text color" hidden></div>
          </div>
          <div class="format-group">
            <button type="button" class="fmt-btn" id="bgColorBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="bgColorPicker" aria-label="Background color" title="Background color">
              <span class="fmt-hl">A</span>
            </button>
            <div class="popover color-picker" id="bgColorPicker" role="dialog" aria-label="Background color" hidden></div>
          </div>
          <span class="fmt-sep" aria-hidden="true"></span>
          <button type="button" id="textSmaller" class="fmt-btn small-a" aria-label="Smaller text" title="Smaller text">A</button>
          <button type="button" id="textLarger" class="fmt-btn big-a" aria-label="Larger text" title="Larger text">A</button>
        </div>
      </div>

      <form id="form" class="composer">
        <div class="attachment-preview" id="attachmentPreview" hidden></div>
        <div class="avatar-col">
          <!-- Filled in by retro.js with whichever icon you picked. -->
          <button type="button" class="buddy-icon icon-btn" id="myIconBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="iconPicker" aria-label="Change your buddy icon" title="Change your buddy icon"></button>
          <span class="sn-label">Ale</span>
          <div class="popover icon-picker" id="iconPicker" role="dialog" aria-label="Choose a buddy icon" hidden>
            <div class="popover-title">Choose a Buddy Icon</div>
            <div class="icon-grid" id="iconGrid"></div>
            <button type="button" class="popover-btn" id="iconUploadBtn">Upload your own…</button>
            <input type="file" id="iconFile" accept="image/*" hidden>
            <p class="popover-note" id="iconNote" hidden></p>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="input-wrap">
          <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach an image" title="Attach an image">
            <svg viewBox="0 0 10 10" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 1h2v3h3v2H6v3H4V6H1V4h3z" fill="currentColor"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Type your message…" autofocus></textarea>
        </div>
        <button class="send" id="sendBtn" type="submit">
          <svg viewBox="0 0 30 15" width="48" height="24" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M0 4h7v1H0zm2 3h6v1H2zm-2 3h7v1H0z" fill="#3d3a2e"/>
            <rect x="10.5" y="1.5" width="18" height="12" fill="#f7a823" stroke="#3d3a2e"/>
            <path d="M11 2l8.5 6.5L28 2" fill="none" stroke="#3d3a2e"/>
          </svg>
          Send
        </button>
      </form>
    </div>
  </div>

  <div class="statusbar">
    <span class="status-text">Slate Bot is AI and can make mistakes. Check important info.</span>
    <div class="status-controls">
      <label class="theme-field">
        Scene:
        <select id="scenePicker" class="theme-picker" aria-label="Desktop scene"></select>
      </label>
      <label class="theme-field">
        Theme:
      <select id="themePicker" class="theme-picker"></select>
      </label>
    </div>
  </div>
  <span class="resize-handle resize-nw" data-resize="nw" aria-hidden="true"></span>
  <span class="resize-handle resize-ne" data-resize="ne" aria-hidden="true"></span>
  <span class="resize-handle resize-sw" data-resize="sw" aria-hidden="true"></span>
  <span class="resize-handle resize-se" data-resize="se" aria-hidden="true"></span>
</div>

<main class="desktop" id="desktop">
  <!-- ../dist/main.js fills the bin and swaps in the full picture when it has chats. -->

    </span>
    <span class="desktop-icon-label">Recycle Bin</span>
  </button>
