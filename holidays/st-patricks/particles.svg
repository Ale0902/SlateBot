    <g id="shamrock">
      <path d="M0 0Q.2 3.4 2 6" fill="none" stroke-width="1.1" stroke-linecap="round"/>
      <use href="#heart" transform="scale(.3) translate(-12 -21.35)"/>
      <use href="#heart" transform="rotate(120) scale(.3) translate(-12 -21.35)"/>
      <use href="#heart" transform="rotate(240) scale(.3) translate(-12 -21.35)"/>
    </g>
