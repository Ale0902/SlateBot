  <use href="#shamrock" fill="#7ee0a1" stroke="#7ee0a1" transform="translate(220 160) rotate(40) scale(1.8)"/>
  <use href="#shamrock" fill="#2ecc71" stroke="#2ecc71" transform="translate(100 170) rotate(-35) scale(1.3)"/>
  <use href="#shamrock" fill="#1f9d55" stroke="#1f9d55" transform="translate(40 220) rotate(10) scale(1.1)"/>
  <use href="#coin" transform="translate(130 90) scale(4.5)"/>
